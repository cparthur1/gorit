<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Google Hero Gradient from Flashcards -->
    <linearGradient id="nHeroGrad" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#b8caff"/>
      <stop offset="20%" stop-color="#82a6ff"/>
      <stop offset="50%" stop-color="#3b82f7"/>
      <stop offset="82%" stop-color="#1d61e8"/>
      <stop offset="100%" stop-color="#1042b5"/>
    </linearGradient>

    <!-- Rear Card: Darker saturated cobalt -->
    <linearGradient id="nRearGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2565ec"/>
      <stop offset="100%" stop-color="#0e3a9c"/>
    </linearGradient>

    <!-- Mid Card: Royal blue -->
    <linearGradient id="nMidGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#4e8aff"/>
      <stop offset="100%" stop-color="#184ec6"/>
    </linearGradient>

    <!-- Subtle inter-layer contact shadow (NO outline) -->
    <filter id="nLayerShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dx="-1" dy="4" result="off"/>
      <feFlood flood-color="#06163a" flood-opacity="0.24" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="shad"/>
      <feMerge>
        <feMergeNode in="shad"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- White Circle Base Shadow for home screen contrast -->
    <filter id="circleBaseShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b1"/>
      <feOffset in="b1" dx="0" dy="8" result="o1"/>
      <feFlood flood-color="#091e42" flood-opacity="0.10" result="c1"/>
      <feComposite in="c1" in2="o1" operator="in" result="s1"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b2"/>
      <feOffset in="b2" dx="0" dy="2.5" result="o2"/>
      <feFlood flood-color="#091e42" flood-opacity="0.08" result="c2"/>
      <feComposite in="c2" in2="o2" operator="in" result="s2"/>

      <feMerge>
        <feMergeNode in="s1"/>
        <feMergeNode in="s2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Rear Layer: Exam Schedule / Calendar Card tilted slightly -->
    <g transform="rotate(-12) translate(-14, -8)">
      <rect x="-105" y="-140" width="210" height="280" rx="36" fill="url(#nRearGrad)"/>
      <path d="M 40 -140 L 75 -140 L 75 -100 L 57.5 -112 L 40 -100 Z" fill="#ffffff" opacity="0.35"/>
      <circle cx="-55" cy="-85" r="9" fill="#ffffff" opacity="0.25"/>
      <circle cx="-25" cy="-85" r="9" fill="#ffffff" opacity="0.25"/>
      <circle cx="5" cy="-85" r="9" fill="#ffffff" opacity="0.25"/>
    </g>

    <!-- Front Hero Layer: Gorit Study & Progress Tracker Slate -->
    <g transform="rotate(4) translate(10, 6)" filter="url(#nLayerShadow)">
      <rect x="-105" y="-140" width="210" height="280" rx="36" fill="url(#nHeroGrad)"/>
      
      <!-- Top Planner Binder / Clip -->
      <rect x="-42" y="-154" width="84" height="26" rx="13" fill="#ffffff" filter="url(#nLayerShadow)"/>
      <rect x="-24" y="-146" width="48" height="10" rx="5" fill="#3b82f7" opacity="0.85"/>

      <!-- Circular Progress Ring & Checkmark (Center-Top) -->
      <g transform="translate(0, -56)">
        <circle cx="0" cy="0" r="38" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.28"/>
        <path d="M 0 -38 A 38 38 0 1 1 -38 0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="26" fill="#ffffff"/>
        <path d="M -9 0 L -2 7 L 11 -6" fill="none" stroke="#2563eb" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Study Checklist Bars -->
      <g transform="translate(0, 10)">
        <circle cx="-62" cy="0" r="7" fill="#ffffff"/>
        <path d="M -65 0 L -63 2 L -59 -2" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="-46" y="-6" width="108" height="12" rx="6" fill="#ffffff" opacity="0.95"/>
      </g>

      <g transform="translate(0, 38)">
        <circle cx="-62" cy="0" r="7" fill="#ffffff"/>
        <path d="M -65 0 L -63 2 L -59 -2" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="-46" y="-6" width="84" height="12" rx="6" fill="#ffffff" opacity="0.95"/>
      </g>

      <g transform="translate(0, 66)">
        <circle cx="-62" cy="0" r="7" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
        <rect x="-46" y="-6" width="56" height="12" rx="6" fill="#ffffff" opacity="0.75"/>
      </g>

      <!-- Bottom Semester Progress Track -->
      <g transform="translate(0, 102)">
        <rect x="-70" y="0" width="140" height="8" rx="4" fill="#ffffff" opacity="0.30"/>
        <rect x="-70" y="0" width="105" height="8" rx="4" fill="#ffffff" opacity="0.95"/>
      </g>
    </g>
  </g>
</svg>