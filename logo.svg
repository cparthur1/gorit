<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">

  <defs>
    <!-- Google Hero Gradient from Flashcards -->
    <linearGradient id="nHeroGrad" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#b8caff"/>
      <stop offset="20%" stop-color="#82a6ff"/>
      <stop offset="50%" stop-color="#3b82f7"/>
      <stop offset="82%" stop-color="#1d61e8"/>
      <stop offset="100%" stop-color="#1042b5"/>
    </linearGradient>

    <!-- Rear Card: Darker saturated cobalt -->
    <linearGradient id="nRearGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2565ec"/>
      <stop offset="100%" stop-color="#0e3a9c"/>
    </linearGradient>

    <!-- Mid Card: Royal blue -->
    <linearGradient id="nMidGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#4e8aff"/>
      <stop offset="100%" stop-color="#184ec6"/>
    </linearGradient>

    <!-- Subtle inter-layer contact shadow (NO outline) -->
    <filter id="nLayerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dx="-1" dy="4" result="off"/>
      <feFlood flood-color="#06163a" flood-opacity="0.24" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="shad"/>
      <feMerge>
        <feMergeNode in="shad"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- White Circle Base Shadow for home screen contrast -->
    <filter id="nCircleBaseShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b1"/>
      <feOffset in="b1" dx="0" dy="8" result="o1"/>
      <feFlood flood-color="#091e42" flood-opacity="0.10" result="c1"/>
      <feComposite in="c1" in2="o1" operator="in" result="s1"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b2"/>
      <feOffset in="b2" dx="0" dy="2.5" result="o2"/>
      <feFlood flood-color="#091e42" flood-opacity="0.08" result="c2"/>
      <feComposite in="c2" in2="o2" operator="in" result="s2"/>

      <feMerge>
        <feMergeNode in="s1"/>
        <feMergeNode in="s2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- NO BACKGROUND: 100% Transparent Canvas (Following Flashcards logo.svg) -->
  <g transform="translate(256, 252) scale(1.18)">

    <!-- Back Card -->
    <g transform="rotate(-24) translate(-25, -12)">
      <rect x="-95" y="-130" width="190" height="260" rx="36" fill="url(#nRearGrad)"/>
      <circle cx="0" cy="-80" r="14" fill="#ffffff" opacity="0.30"/>
    </g>

    <!-- Middle Card -->
    <g transform="rotate(-6) translate(-6, -6)" filter="url(#nLayerShadow)">
      <rect x="-95" y="-130" width="190" height="260" rx="36" fill="url(#nMidGrad)"/>
      <circle cx="0" cy="-80" r="14" fill="#ffffff" opacity="0.45"/>
    </g>

    <!-- Front Hero Card (Gorit Task & Study Tracker) -->
    <g transform="rotate(14) translate(18, 8)" filter="url(#nLayerShadow)">
      <rect x="-95" y="-130" width="190" height="260" rx="36" fill="url(#nHeroGrad)"/>
      
      <!-- Top Status Ring with Gorit Checkmark -->
      <circle cx="0" cy="-80" r="16" fill="#ffffff"/>
      <path d="M -6 -80 L -1 -75 L 7 -84" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Task Row 1 (Completed) -->
      <circle cx="-50" cy="-14" r="7.5" fill="#ffffff"/>
      <path d="M -53 -14 L -51 -12 L -47 -16" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-34" y="-20" width="88" height="12" rx="6" fill="#ffffff" opacity="0.95"/>

      <!-- Task Row 2 (Completed) -->
      <circle cx="-50" cy="18" r="7.5" fill="#ffffff"/>
      <path d="M -53 18 L -51 20 L -47 16" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-34" y="12" width="68" height="12" rx="6" fill="#ffffff" opacity="0.95"/>

      <!-- Task Row 3 (In Progress) -->
      <circle cx="-50" cy="50" r="7.5" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
      <rect x="-34" y="44" width="45" height="12" rx="6" fill="#ffffff" opacity="0.80"/>

      <!-- Bottom Progress Track -->
      <rect x="-56" y="80" width="112" height="7" rx="3.5" fill="#ffffff" opacity="0.30"/>
      <rect x="-56" y="80" width="78" height="7" rx="3.5" fill="#ffffff" opacity="0.95"/>
    </g>

  </g>
</svg>